<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>BugSnap 普通用户记录测试</title><style>body{font:15px/1.8 system-ui;background:#f7f6fa;color:#342c40;padding:35px;max-width:1000px;margin:auto}li{padding:10px;margin:8px;background:white;border:1px solid #e5e0ed;border-radius:8px}.fixture{padding:15px;background:white;border:1px solid #ddd}input,textarea,select,button,[contenteditable]{margin:6px;padding:8px;border:1px solid #ddd}#feedback{padding:15px;background:#fff2df}</style></head><body><h1>操作与页面反馈 · 浏览器集成测试</h1><ol id="results"></ol><section class="fixture"><form id="form"><label>姓名<input id="name"></label><label>密码<input type="password" id="password"></label><textarea id="message" aria-label="备注"></textarea><div id="editable" contenteditable="" aria-label="可编辑说明"></div><label><input id="checkbox" type="checkbox">接收通知</label><select id="choice" aria-label="处理方式"><option value="one">选项一</option><option value="private-choice">私密选择</option></select><button id="save" type="button">保存</button><button type="submit">提交</button></form><div id="feedback" role="alert" hidden></div></section><script type="module" src="interaction-browser.js"></script></body></html>
