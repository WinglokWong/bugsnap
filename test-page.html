<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BugSnap 测试台 · 登录按钮问题</title><style>body{font:15px system-ui;background:#f3f4fa;color:#323247;margin:0}header{padding:24px 6vw;background:white;border-bottom:1px solid #e5e6ef}main{max-width:820px;margin:50px auto;padding:20px}h1{font-size:32px}p,li{color:#858398;line-height:1.9}.card{background:white;padding:30px;border:1px solid #e5e6ef;border-radius:18px;max-width:360px;margin:30px 0}label{display:block;font-size:13px;margin:16px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font:inherit}button{margin-top:20px;border:0;border-radius:8px;padding:13px;background:#7660d9;color:white;width:100%;font:inherit}.row{display:flex;gap:10px}.row button{background:#ece8f7;color:#7660d9}.scroll-space{height:800px}</style></head><body><header><b>BugSnap</b> / 功能测试台</header><main><h1>把问题，留在现场。</h1><p>这里的登录按钮故意没有交互，用来测试问题采集和标注。</p><div class="card"><h2>登录你的工作空间</h2><label for="email">邮箱</label><input id="email" placeholder="name@example.com"><label for="password">密码</label><input id="password" type="password" value="do-not-collect"><button class="login-submit" type="button" data-testid="login">登录</button><div class="row"><button class="repeated">重复按钮 A</button><button class="repeated">重复按钮 B</button></div><button id="special:id.with.dots">特殊 ID 测试</button></div><ol><li>点击工具栏 BugSnap 图标打开侧边栏。</li><li>选择「登录」按钮，确认选择器和截图已采集。</li><li>框选问题位置，添加文字，填写标题并保存。</li><li>检查历史记录、复制、Markdown ZIP 和 JSON 导出。</li><li>验证重复按钮和带特殊字符 ID 的选择器。</li></ol><section class="card"><h2>v1.1 运行诊断与对比</h2><p>先在 BugSnap 开始记录，再触发以下测试。</p><button id="trigger-js">触发 JS 错误</button><button id="trigger-console">触发 console.error</button><button id="trigger-promise">触发 Promise 拒绝</button><button id="trigger-fetch">触发 fetch 404</button><button id="trigger-xhr">触发 XHR 404</button><button id="trigger-resource">触发图片加载失败</button><button id="toggle-fix">切换登录按钮修复前 / 后</button><p id="test-feedback" role="status"></p><div id="test-resources"></div></section><div class="scroll-space"></div><button id="below-fold">滚动后采集这个按钮</button></main><script src="test-errors.js"></script></body></html>
